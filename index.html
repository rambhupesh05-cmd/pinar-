<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  <title>PinAR</title>

  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- A-Frame + AR.js GPS (pinned) -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    /* ═══ Design tokens ═══════════════════════════════════════════════════════ */
    :root {
      --bg-primary:     #000000;
      --bg-elevated:    #1c1c1e;
      --bg-card:        #2c2c2e;
      --bg-glass:       rgba(14,14,16,0.82);
      --border-subtle:  rgba(255,255,255,0.08);
      --border-medium:  rgba(255,255,255,0.14);
      --text-primary:   #ffffff;
      --text-secondary: rgba(255,255,255,0.5);
      --text-tertiary:  rgba(255,255,255,0.3);
      --accent-blue:    #0a84ff;
      --accent-green:   #32d74b;
      --accent-red:     #ff453a;
      --tab-h:          90px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layer stack ─────────────────────────────────────────────────────── */
    a-scene {
      position: fixed; inset: 0; z-index: 0;
    }
    #map-view {
      position: fixed; inset: 0; bottom: var(--tab-h);
      z-index: 15; display: none;
    }
    #map-view.visible { display: block; }
    #map-container { width: 100%; height: 100%; }

    #hud { position: fixed; inset: 0; z-index: 18; pointer-events: none; }

    /* AR-only HUD elements: hide in map view */
    body.view-map #compass-strip,
    body.view-map #empty-state,
    body.view-map #nav-banner { display: none !important; }

    /* ─── Top bar ─────────────────────────────────────────────────────────── */
    #top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 54px 16px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
      pointer-events: none;
    }
    #app-logo {
      font-size: 20px; font-weight: 800; color: var(--text-primary);
      letter-spacing: -0.8px;
    }
    #top-bar-right {
      display: flex; align-items: center; gap: 8px;
      pointer-events: auto;
    }

    /* GPS badge */
    #gps-badge {
      display: flex; align-items: center; gap: 7px;
      background: var(--bg-glass); backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border-medium);
      border-radius: 20px; padding: 7px 12px; height: 36px;
    }
    #gps-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent-red);
      transition: background 0.4s;
      flex-shrink: 0;
    }
    #gps-dot.locating {
      animation: pulse-locating 1.2s ease-in-out infinite;
    }
    #gps-dot.active { background: var(--accent-green); animation: none; }
    #gps-dot.weak   { background: #ff9f0a; animation: none; }
    #gps-label {
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.88); letter-spacing: -0.1px;
    }

    /* Info button — 44×44 touch target */
    #btn-info {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--bg-glass); backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border-medium);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #btn-info:active { background: rgba(255,255,255,0.1); }
    #btn-info svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.85); }

    /* ─── Nav banner ──────────────────────────────────────────────────────── */
    #nav-banner {
      position: absolute; top: 118px; left: 14px; right: 14px;
      display: none;
      background: var(--bg-glass); backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-medium);
      border-radius: 20px; padding: 11px 12px;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    #nav-banner.visible { display: flex; align-items: center; gap: 10px; }
    /* Whole banner is tappable whenever visible */
    #nav-banner.visible { pointer-events: auto; }
    #nav-banner.visible:not(.navigating) { cursor: pointer; }
    #nav-banner.visible:not(.navigating):active { background: rgba(255,255,255,0.06); }

    #nav-banner.navigating {
      background: rgba(10,132,255,0.18);
      border-color: rgba(10,132,255,0.38);
      box-shadow: 0 0 0 1px rgba(10,132,255,0.12);
    }

    /* Arrived flash state */
    #nav-banner.arrived {
      background: rgba(50,215,75,0.18);
      border-color: rgba(50,215,75,0.4);
      box-shadow: 0 0 0 1px rgba(50,215,75,0.15), 0 4px 20px rgba(50,215,75,0.1);
    }
    #nav-banner.arrived #nav-banner-arrow {
      background: rgba(50,215,75,0.18);
    }

    /* Directional chevron box */
    #nav-banner-arrow {
      width: 42px; height: 42px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.07); border-radius: 13px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #nav-banner-arrow svg {
      width: 22px; height: 22px;
      stroke: #fff; fill: none; stroke-width: 2.5;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Text content */
    #nav-banner-content { flex: 1; min-width: 0; }
    #nav-banner-top {
      display: flex; align-items: center; gap: 5px; margin-bottom: 4px;
    }
    #nav-banner-emoji { font-size: 14px; flex-shrink: 0; }
    #nav-banner-name {
      font-size: 15px; font-weight: 700; color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #nav-banner-label {
      font-size: 9px; font-weight: 700; color: var(--accent-blue);
      letter-spacing: 0.6px; text-transform: uppercase;
      background: rgba(10,132,255,0.18); border-radius: 4px; padding: 2px 5px;
      display: none; flex-shrink: 0;
    }
    #nav-banner.navigating #nav-banner-label { display: block; }

    #nav-banner-bottom { display: flex; align-items: center; gap: 8px; }
    #nav-banner-dist { font-size: 13px; color: var(--text-secondary); flex-shrink: 0; }

    /* Progress bar — only visible during active navigation */
    #nav-progress-track {
      flex: 1; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.1); display: none; overflow: hidden;
    }
    #nav-banner.navigating #nav-progress-track { display: block; }
    #nav-progress-fill {
      height: 100%; width: 0%; border-radius: 2px;
      background: linear-gradient(to right, rgba(10,132,255,0.6), var(--accent-blue));
      transition: width 0.5s ease;
    }

    /* Start button (passive state — tap banner to navigate) */
    #nav-start-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      background: rgba(255,255,255,0.07); border: none; border-radius: 50%;
      color: rgba(255,255,255,0.45); cursor: pointer;
      display: none; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #nav-start-btn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    #nav-start-btn:active { background: rgba(255,255,255,0.18); }
    #nav-banner.visible:not(.navigating) #nav-start-btn { display: flex; }

    /* Stop button */
    #nav-stop-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      background: rgba(255,255,255,0.08); border: none; border-radius: 50%;
      color: var(--text-secondary); cursor: pointer;
      display: none; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #nav-stop-btn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
    #nav-stop-btn:active { background: rgba(255,255,255,0.18); }
    #nav-banner.navigating #nav-stop-btn { display: flex; }

    /* ─── Empty state ─────────────────────────────────────────────────────── */
    #empty-state {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -62%);
      text-align: center; pointer-events: none; padding: 0 36px;
    }
    .empty-icon { font-size: 52px; margin-bottom: 18px; display: block; }
    .empty-title {
      font-size: 20px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 10px; letter-spacing: -0.3px;
    }
    .empty-body {
      font-size: 15px; color: var(--text-secondary); line-height: 1.65;
    }
    .empty-body strong { color: rgba(255,255,255,0.7); font-weight: 600; }
    .empty-arrow {
      font-size: 22px; color: var(--text-tertiary); margin-top: 28px; display: block;
      animation: bounce-down 1.8s ease-in-out infinite;
    }

    /* ─── Compass pill ────────────────────────────────────────────────────── */
    #compass-strip {
      position: absolute;
      bottom: calc(var(--tab-h) + 18px);
      left: 50%; transform: translateX(-50%);
      width: min(268px, 74vw); height: 46px;
      border-radius: 23px;
      background: var(--bg-glass);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--border-medium);
      overflow: hidden; pointer-events: none;
    }
    #compass-canvas { display: block; width: 100%; height: 46px; }

    /* ─── Tab bar ─────────────────────────────────────────────────────────── */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--tab-h);
      display: flex; align-items: flex-start; justify-content: space-around;
      padding-top: 10px;
      padding-bottom: max(28px, env(safe-area-inset-bottom, 28px));
      background: rgba(10,10,12,0.94);
      backdrop-filter: blur(28px) saturate(200%);
      border-top: 1px solid var(--border-subtle);
      z-index: 20; position: fixed;
    }

    /* Sliding active indicator at top of tab bar */
    #tab-indicator {
      position: absolute; top: 0;
      height: 2px; width: 50px;
      background: var(--accent-blue);
      border-radius: 0 0 2px 2px;
      transition: left 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      left: 0;
    }

    .tab-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none;
      color: rgba(255,255,255,0.35);
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      cursor: pointer; padding: 4px 20px;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s;
      min-width: 60px;
    }
    .tab-btn svg {
      width: 23px; height: 23px; stroke: currentColor;
      fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .tab-btn.active { color: var(--accent-blue); }

    #tab-map { position: relative; }
    .tab-badge {
      position: absolute; top: 0; right: 8px;
      min-width: 17px; height: 17px; border-radius: 9px;
      background: var(--accent-blue); color: #fff;
      font-size: 10px; font-weight: 700;
      display: none; align-items: center; justify-content: center; padding: 0 4px;
      border: 1.5px solid rgba(10,10,12,0.94);
    }
    .tab-badge.visible { display: flex; }

    /* + Add button */
    #btn-add {
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--accent-blue); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; margin-top: -4px;
      box-shadow: 0 4px 22px rgba(10,132,255,0.5), inset 0 1px 0 rgba(255,255,255,0.22);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s, background 0.14s, box-shadow 0.14s;
    }
    #btn-add:active {
      transform: scale(0.88);
      background: #0071e3;
      box-shadow: 0 2px 12px rgba(10,132,255,0.4);
    }
    #btn-add svg {
      width: 28px; height: 28px; stroke: #fff;
      stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ─── Map overlay controls ────────────────────────────────────────────── */
    #btn-recenter {
      position: absolute; bottom: 24px; right: 16px;
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(18,18,20,0.92); backdrop-filter: blur(16px);
      border: 1px solid var(--border-medium);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000;
      box-shadow: 0 2px 16px rgba(0,0,0,0.45);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #btn-recenter:active { background: rgba(40,40,44,0.95); }
    #btn-recenter svg {
      width: 20px; height: 20px; stroke: rgba(255,255,255,0.85);
      fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ─── Leaflet overrides ───────────────────────────────────────────────── */
    .leaflet-control-zoom a {
      background: rgba(18,18,20,0.92) !important;
      color: rgba(255,255,255,0.8) !important;
      border-color: var(--border-medium) !important;
      backdrop-filter: blur(12px);
    }
    .leaflet-control-zoom a:hover { background: rgba(40,40,44,0.95) !important; }
    .leaflet-bar { border: none !important; box-shadow: 0 2px 14px rgba(0,0,0,0.45) !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.52) !important;
      color: rgba(255,255,255,0.28) !important;
      backdrop-filter: blur(8px); font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.38) !important; }

    /* ─── Map pin markers ─────────────────────────────────────────────────── */
    .map-pin-wrap {
      display: flex; flex-direction: column; align-items: center;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }
    .map-pin-dot {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--pin-color);
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid rgba(255,255,255,0.38);
    }
    .map-pin-emoji { font-size: 20px; line-height: 1; }
    .map-pin-tip {
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 11px solid var(--pin-color);
      margin-top: -1px;
    }

    /* ─── User dot ────────────────────────────────────────────────────────── */
    .user-dot {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent-blue); border: 3px solid #fff;
      box-shadow: 0 0 0 0 rgba(10,132,255,0.45);
      animation: pulse-dot 2.2s infinite;
    }
    @keyframes pulse-dot {
      0%   { box-shadow: 0 0 0 0   rgba(10,132,255,0.5); }
      70%  { box-shadow: 0 0 0 14px rgba(10,132,255,0);   }
      100% { box-shadow: 0 0 0 0   rgba(10,132,255,0);   }
    }

    /* ─── Map popups ──────────────────────────────────────────────────────── */
    .pinar-popup .leaflet-popup-content-wrapper {
      background: var(--bg-elevated);
      border: 1px solid var(--border-medium);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      padding: 0; overflow: hidden;
    }
    .pinar-popup .leaflet-popup-content { margin: 0; }
    .pinar-popup .leaflet-popup-tip-container { display: none; }
    .pinar-popup .leaflet-popup-close-button { display: none; }

    .popup-inner { padding: 16px 16px 12px; }
    .popup-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .popup-big-emoji { font-size: 32px; line-height: 1; flex-shrink: 0; }
    .popup-title { font-size: 17px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
    .popup-meta  { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

    /* Stacked popup actions */
    .popup-actions { display: flex; flex-direction: column; gap: 7px; }
    .popup-btn {
      width: 100%; padding: 12px 14px;
      border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      background: var(--bg-card); color: var(--accent-blue);
      text-align: left; display: flex; align-items: center; gap: 8px;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .popup-btn:active { background: #3a3a3c; }
    .popup-btn .btn-icon { font-size: 16px; }
    .popup-btn.nav  { color: var(--accent-green); }
    .popup-btn.del  { color: var(--accent-red); }

    /* ─── Bottom sheet ────────────────────────────────────────────────────── */
    #sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 25;
    }
    #sheet-overlay.visible { opacity: 1; pointer-events: auto; }

    #bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--bg-elevated); border-radius: 24px 24px 0 0;
      padding: 10px 20px max(44px, env(safe-area-inset-bottom, 44px));
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 26; max-height: 90vh; overflow-y: auto;
      border-top: 1px solid var(--border-subtle);
    }
    #bottom-sheet.visible { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.22); margin: 0 auto 18px;
    }
    .sheet-title {
      font-size: 18px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 20px; letter-spacing: -0.3px;
    }

    /* ─── Sheet: add pin ──────────────────────────────────────────────────── */
    .pin-name-input {
      width: 100%; padding: 14px 16px;
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; color: var(--text-primary); font-size: 16px;
      outline: none; margin-bottom: 16px; transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .pin-name-input::placeholder { color: rgba(255,255,255,0.22); }
    .pin-name-input:focus { border-color: var(--accent-blue); }
    .pin-name-input.shake { animation: shake 0.35s; border-color: var(--accent-red); }

    .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .emoji-btn {
      width: 46px; height: 46px; border-radius: 12px;
      background: var(--bg-card); border: 1.5px solid transparent;
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .emoji-btn.selected { border-color: var(--accent-blue); background: rgba(10,132,255,0.14); }
    .emoji-btn:active { background: rgba(255,255,255,0.06); }

    .coords-hint {
      font-size: 12px; color: var(--text-tertiary);
      text-align: center; margin-bottom: 18px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    /* ─── Sheet: pin list ─────────────────────────────────────────────────── */
    .list-sort-bar {
      display: flex; gap: 0; margin-bottom: 16px;
      background: var(--bg-card); border-radius: 10px; padding: 2px;
    }
    .sort-btn {
      flex: 1; padding: 7px 4px;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      background: transparent; transition: background 0.15s, color 0.15s;
    }
    .sort-btn.active { background: var(--bg-elevated); color: var(--text-primary); }

    .pin-list { max-height: 55vh; overflow-y: auto; }
    .pin-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .pin-row:last-child { border-bottom: none; }

    /* Colored emoji circle */
    .pin-emoji-wrap {
      width: 46px; height: 46px; border-radius: 14px;
      background: var(--pin-row-color, rgba(10,132,255,0.14));
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pin-emoji { font-size: 22px; line-height: 1; }

    .pin-info  { flex: 1; min-width: 0; }
    .pin-info-name {
      font-size: 15px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pin-info-meta {
      font-size: 12px; color: var(--text-secondary);
      display: flex; gap: 8px; margin-top: 3px; align-items: center;
    }
    .pin-dist-label { color: var(--accent-blue); font-weight: 500; }

    .pin-actions { display: flex; gap: 0; flex-shrink: 0; }
    .btn-navigate, .btn-share, .btn-delete {
      background: none; border: none; cursor: pointer;
      padding: 8px 9px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .btn-navigate { color: var(--accent-green); }
    .btn-share    { color: var(--accent-blue); }
    .btn-delete   { color: var(--accent-red); }
    .btn-navigate:active, .btn-share:active, .btn-delete:active { background: rgba(255,255,255,0.06); }
    .btn-navigate svg, .btn-share svg, .btn-delete svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ─── Sheet: info ─────────────────────────────────────────────────────── */
    .info-row {
      display: flex; gap: 14px; padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .info-row:last-child { border-bottom: none; }
    .info-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .info-text { flex: 1; font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.55; padding-top: 9px; }

    /* ─── Sheet: shared pin ───────────────────────────────────────────────── */
    .shared-pin-preview {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border-radius: 16px; padding: 18px; margin-bottom: 20px;
    }
    .shared-pin-preview .big-emoji { font-size: 42px; }
    .shared-pin-preview-name { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .shared-pin-preview-coords { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    /* ─── Buttons ─────────────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: 16px;
      background: var(--accent-blue); border: none; border-radius: 15px;
      color: #fff; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .btn-primary:active { background: #0071e3; transform: scale(0.98); }
    .btn-primary.green { background: var(--accent-green); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); }
    .btn-primary.green:active { background: #28c141; }
    .btn-secondary {
      width: 100%; padding: 16px;
      background: var(--bg-card); border: none; border-radius: 15px;
      color: var(--text-primary); font-size: 17px; font-weight: 600;
      cursor: pointer; margin-top: 10px; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:active { background: #3a3a3c; }

    /* ─── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 106px; left: 50%;
      transform: translateX(-50%) translateY(18px);
      background: rgba(24,24,26,0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 11px 20px;
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap; z-index: 40;
      max-width: calc(100vw - 32px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Loading screen ──────────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-logo {
      font-size: 36px; font-weight: 800; color: #fff;
      letter-spacing: -1px;
    }
    #loading-sub { font-size: 14px; color: rgba(255,255,255,0.35); }
    .spinner {
      width: 26px; height: 26px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ─── Keyframes ───────────────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-locating {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }
    @keyframes bounce-down {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(7px); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX( 6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX( 4px); }
    }
  </style>
</head>
<body>

  <!-- ── AR scene ────────────────────────────────────────────────────────── -->
  <a-scene
    id="ar-scene"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    renderer="antialias: true; alpha: true"
    embedded>
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>

  <!-- ── Map view ────────────────────────────────────────────────────────── -->
  <div id="map-view">
    <div id="map-container"></div>
    <button id="btn-recenter" aria-label="Center on my location">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <!-- ── HUD (shared across views) ────────────────────────────────────────── -->
  <div id="hud">
    <div id="top-bar">
      <span id="app-logo">PinAR</span>
      <div id="top-bar-right">
        <div id="gps-badge">
          <div id="gps-dot" class="locating"></div>
          <span id="gps-label">Locating…</span>
        </div>
        <button id="btn-info" aria-label="About">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Nav banner: redesigned with chevron + progress bar -->
    <div id="nav-banner">
      <div id="nav-banner-arrow">
        <svg viewBox="0 0 24 24">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </div>
      <div id="nav-banner-content">
        <div id="nav-banner-top">
          <span id="nav-banner-emoji"></span>
          <span id="nav-banner-name"></span>
          <span id="nav-banner-label">Navigating</span>
        </div>
        <div id="nav-banner-bottom">
          <span id="nav-banner-dist"></span>
          <div id="nav-progress-track">
            <div id="nav-progress-fill"></div>
          </div>
        </div>
      </div>
      <button id="nav-start-btn" aria-label="Navigate to nearest pin">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button id="nav-stop-btn" aria-label="Stop navigating">
        <svg viewBox="0 0 24 24" fill="none">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Empty state: improved with title and bouncing arrow -->
    <div id="empty-state">
      <span class="empty-icon">📍</span>
      <h3 class="empty-title">No pins yet</h3>
      <p class="empty-body">Tap the <strong>+</strong> button to save<br>your current location as a pin.</p>
      <span class="empty-arrow">↓</span>
    </div>

    <!-- Compass: now a floating pill -->
    <div id="compass-strip">
      <canvas id="compass-canvas" height="46"></canvas>
    </div>

    <div id="toast"></div>
  </div>

  <!-- ── Tab bar ─────────────────────────────────────────────────────────── -->
  <div id="tab-bar">
    <div id="tab-indicator"></div>

    <button id="tab-ar" class="tab-btn active" aria-label="AR view">
      <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span>AR</span>
    </button>

    <button id="btn-add" aria-label="Add pin">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <button id="tab-map" class="tab-btn" aria-label="Map view">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Map</span>
      <span class="tab-badge" id="pin-count-badge"></span>
    </button>
  </div>

  <!-- ── Bottom sheet ─────────────────────────────────────────────────────── -->
  <div id="sheet-overlay"></div>
  <div id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div id="sheet-content"></div>
  </div>

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div id="loading">
    <div id="loading-logo">PinAR</div>
    <div class="spinner"></div>
    <div id="loading-sub">Starting camera…</div>
  </div>

  <!-- ── Scripts ─────────────────────────────────────────────────────────── -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="modules/SensorLayer.js"></script>
  <script src="modules/PinStore.js"></script>
  <script src="modules/NavEngine.js"></script>
  <script src="modules/ARRenderer.js"></script>
  <script src="modules/MapView.js"></script>
  <script src="modules/UILayer.js"></script>
  <script src="modules/ShareModule.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
