<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PinAR</title>

  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- A-Frame + AR.js GPS (pinned) -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: #000;
    }

    /* ─── Layer stack ─────────────────────────────────────────────────────── */
    a-scene   { position: fixed; inset: 0; z-index: 0; }
    #map-view { position: fixed; inset: 0; bottom: 83px; z-index: 15; display: none; }
    #map-view.visible { display: block; }
    #map-container { width: 100%; height: 100%; }

    #hud { position: fixed; inset: 0; z-index: 18; pointer-events: none; }

    /* AR HUD elements hidden in map view */
    body.view-map #compass-strip,
    body.view-map #empty-state,
    body.view-map #nav-banner { display: none !important; }

    /* ─── Top bar ─────────────────────────────────────────────────────────── */
    #top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 52px 20px 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      pointer-events: none;
    }
    #app-logo {
      font-size: 19px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px;
    }
    #top-bar-right {
      display: flex; align-items: center; gap: 8px;
      pointer-events: auto;
    }
    #gps-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 5px 10px;
    }
    #gps-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ff3b30; transition: background 0.4s;
    }
    #gps-dot.active { background: #30d158; }
    #gps-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85); }

    #btn-info {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #btn-info svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.8); }

    /* ─── Nav banner ──────────────────────────────────────────────────────── */
    #nav-banner {
      position: absolute; top: 115px; left: 50%; transform: translateX(-50%);
      display: none; align-items: center; gap: 7px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px; padding: 8px 14px;
      white-space: nowrap; transition: background 0.3s, border-color 0.3s;
    }
    #nav-banner.visible { display: flex; }
    #nav-banner.navigating {
      background: rgba(0,122,255,0.25);
      border-color: rgba(0,122,255,0.5);
      pointer-events: auto;
    }
    #nav-banner-arrow { font-size: 15px; display: inline-block; transition: transform 0.25s; }
    #nav-banner-emoji { font-size: 15px; }
    #nav-banner-label { font-size: 11px; font-weight: 600; color: #007aff; letter-spacing: 0.3px; display: none; }
    #nav-banner.navigating #nav-banner-label { display: inline; }
    #nav-banner-name { font-size: 13px; font-weight: 600; color: #fff; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
    #nav-banner-dist { font-size: 13px; color: rgba(255,255,255,0.55); }
    #nav-stop-btn {
      background: none; border: none; color: rgba(255,255,255,0.55);
      font-size: 14px; cursor: pointer; padding: 0 0 0 2px; line-height: 1;
      display: none;
    }
    #nav-banner.navigating #nav-stop-btn { display: inline-block; }

    /* ─── Empty state ─────────────────────────────────────────────────────── */
    #empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: rgba(255,255,255,0.5); pointer-events: none;
    }
    #empty-state .icon { font-size: 44px; margin-bottom: 12px; }
    #empty-state p { font-size: 15px; line-height: 1.6; }

    /* ─── Compass strip ───────────────────────────────────────────────────── */
    #compass-strip {
      position: absolute; bottom: 93px; left: 0; right: 0;
      height: 68px; pointer-events: none;
    }
    #compass-canvas { display: block; width: 100%; height: 68px; }

    /* ─── Tab bar ─────────────────────────────────────────────────────────── */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 83px;
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 20px 28px;
      background: rgba(14,14,16,0.92);
      backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid rgba(255,255,255,0.08);
      z-index: 20;
    }
    .tab-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none;
      color: rgba(255,255,255,0.4);
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
      cursor: pointer; padding: 4px 24px;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s;
    }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn.active { color: #007aff; }

    #tab-map { position: relative; }
    .tab-badge {
      position: absolute; top: 0; right: 12px;
      min-width: 16px; height: 16px; border-radius: 8px;
      background: #ff3b30; color: #fff;
      font-size: 10px; font-weight: 700;
      display: none; align-items: center; justify-content: center; padding: 0 3px;
    }
    .tab-badge.visible { display: flex; }

    #btn-add {
      width: 56px; height: 56px; border-radius: 50%;
      background: #007aff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,122,255,0.45);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, background 0.15s;
    }
    #btn-add:active { transform: scale(0.92); background: #0062cc; }
    #btn-add svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ─── Map overlay controls ────────────────────────────────────────────── */
    #btn-recenter {
      position: absolute; bottom: 24px; right: 16px;
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(22,22,24,0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      -webkit-tap-highlight-color: transparent;
    }
    #btn-recenter svg { width: 20px; height: 20px; stroke: rgba(255,255,255,0.85); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ─── Leaflet theme overrides ──────────────────────────────────────────── */
    .leaflet-control-zoom a {
      background: rgba(22,22,24,0.9) !important;
      color: rgba(255,255,255,0.8) !important;
      border-color: rgba(255,255,255,0.12) !important;
      backdrop-filter: blur(12px);
    }
    .leaflet-control-zoom a:hover { background: rgba(40,40,44,0.95) !important; }
    .leaflet-bar { border: none !important; box-shadow: 0 2px 12px rgba(0,0,0,0.4) !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: rgba(255,255,255,0.3) !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.4) !important; }

    /* ─── Map pin markers ─────────────────────────────────────────────────── */
    .map-pin-wrap {
      display: flex; flex-direction: column; align-items: center;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45));
    }
    .map-pin-dot {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--pin-color);
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid rgba(255,255,255,0.35);
    }
    .map-pin-emoji { font-size: 19px; line-height: 1; }
    .map-pin-tip {
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 10px solid var(--pin-color);
      margin-top: -1px;
    }

    /* ─── User dot ────────────────────────────────────────────────────────── */
    .user-dot {
      width: 20px; height: 20px; border-radius: 50%;
      background: #007aff; border: 3px solid #fff;
      box-shadow: 0 0 0 0 rgba(0,122,255,0.45);
      animation: pulse-dot 2.2s infinite;
    }
    @keyframes pulse-dot {
      0%   { box-shadow: 0 0 0 0   rgba(0,122,255,0.5); }
      70%  { box-shadow: 0 0 0 14px rgba(0,122,255,0);   }
      100% { box-shadow: 0 0 0 0   rgba(0,122,255,0);   }
    }

    /* ─── Map popups ──────────────────────────────────────────────────────── */
    .pinar-popup .leaflet-popup-content-wrapper {
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      box-shadow: 0 8px 36px rgba(0,0,0,0.55);
      padding: 0;
    }
    .pinar-popup .leaflet-popup-content { margin: 0; }
    .pinar-popup .leaflet-popup-tip-container { display: none; }
    .pinar-popup .leaflet-popup-close-button { display: none; }

    .popup-inner { padding: 16px; }
    .popup-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .popup-big-emoji { font-size: 30px; line-height: 1; }
    .popup-title { font-size: 16px; font-weight: 700; color: #fff; }
    .popup-meta  { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .popup-actions { display: flex; gap: 8px; }
    .popup-btn {
      flex: 1; padding: 9px 6px;
      border: none; border-radius: 11px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      background: #2c2c2e; color: #007aff;
      transition: background 0.15s; white-space: nowrap;
    }
    .popup-btn:active { background: #3a3a3c; }
    .popup-btn.nav  { color: #30d158; }
    .popup-btn.del  { color: #ff453a; }

    /* ─── Bottom sheet ────────────────────────────────────────────────────── */
    #sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 25;
    }
    #sheet-overlay.visible { opacity: 1; pointer-events: auto; }

    #bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #1c1c1e; border-radius: 22px 22px 0 0;
      padding: 12px 20px 48px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 26;
      max-height: 90vh; overflow-y: auto;
    }
    #bottom-sheet.visible { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.2); margin: 0 auto 20px;
    }
    .sheet-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 20px; }

    /* ─── Sheet: add pin ──────────────────────────────────────────────────── */
    .pin-name-input {
      width: 100%; padding: 14px 16px;
      background: #2c2c2e; border: 1px solid #3a3a3c;
      border-radius: 13px; color: #fff; font-size: 16px;
      outline: none; margin-bottom: 16px; transition: border-color 0.2s;
    }
    .pin-name-input::placeholder { color: rgba(255,255,255,0.25); }
    .pin-name-input:focus { border-color: #007aff; }
    .pin-name-input.shake { animation: shake 0.35s; border-color: #ff453a; }

    .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .emoji-btn {
      width: 44px; height: 44px; border-radius: 11px;
      background: #2c2c2e; border: 1.5px solid transparent;
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .emoji-btn.selected { border-color: #007aff; background: rgba(0,122,255,0.15); }

    .coords-hint {
      font-size: 12px; color: rgba(255,255,255,0.3);
      text-align: center; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    /* ─── Sheet: pin list ─────────────────────────────────────────────────── */
    .pin-list { max-height: 55vh; overflow-y: auto; }
    .pin-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .pin-row:last-child { border-bottom: none; }
    .pin-emoji { font-size: 26px; flex-shrink: 0; }
    .pin-info  { flex: 1; min-width: 0; }
    .pin-info-name {
      font-size: 15px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pin-info-meta { font-size: 12px; color: rgba(255,255,255,0.35); display: flex; gap: 8px; margin-top: 2px; }
    .pin-dist-label { color: #007aff; font-weight: 500; }
    .pin-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .btn-navigate { background: none; border: none; font-size: 15px; cursor: pointer; padding: 6px 7px; color: #30d158; }
    .btn-share    { background: none; border: none; color: #007aff;  font-size: 13px; cursor: pointer; padding: 6px 7px; font-weight: 500; }
    .btn-delete   { background: none; border: none; color: #ff453a; font-size: 13px; cursor: pointer; padding: 6px 7px; font-weight: 500; }

    /* ─── Sheet: share ────────────────────────────────────────────────────── */
    .share-pin-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .share-pin-header .big-emoji { font-size: 36px; }
    .share-pin-header-name { font-size: 18px; font-weight: 700; color: #fff; }
    .share-pin-header-sub  { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 3px; }
    .qr-wrap {
      display: flex; justify-content: center; margin-bottom: 20px;
    }
    .qr-wrap canvas { border-radius: 14px; display: block; }
    .qr-url {
      font-size: 10px; color: rgba(255,255,255,0.25);
      text-align: center; word-break: break-all;
      margin-bottom: 20px; line-height: 1.5;
    }

    /* ─── Sheet: info ─────────────────────────────────────────────────────── */
    .info-row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .info-row:last-child { border-bottom: none; }
    .info-icon { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
    .info-text { flex: 1; font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.55; }

    /* ─── Sheet: shared pin ───────────────────────────────────────────────── */
    .shared-pin-preview {
      display: flex; align-items: center; gap: 14px;
      background: #2c2c2e; border-radius: 14px; padding: 16px; margin-bottom: 20px;
    }
    .shared-pin-preview .big-emoji { font-size: 40px; }
    .shared-pin-preview-name { font-size: 18px; font-weight: 700; color: #fff; }
    .shared-pin-preview-coords { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 4px; }

    /* ─── Buttons ─────────────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: 15px;
      background: #007aff; border: none; border-radius: 14px;
      color: #fff; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:active { background: #0062cc; }
    .btn-primary.green { background: #30d158; }
    .btn-primary.green:active { background: #25a244; }
    .btn-secondary {
      width: 100%; padding: 15px;
      background: #2c2c2e; border: none; border-radius: 14px;
      color: #fff; font-size: 17px; font-weight: 600;
      cursor: pointer; margin-top: 10px; transition: background 0.15s;
    }
    .btn-secondary:active { background: #3a3a3c; }

    /* ─── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: rgba(28,28,30,0.97); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 13px; padding: 10px 18px;
      font-size: 13px; font-weight: 500; color: #fff;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap; z-index: 40;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Loading ─────────────────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-logo { font-size: 34px; font-weight: 800; color: #fff; letter-spacing: -0.8px; }
    #loading-sub  { font-size: 14px; color: rgba(255,255,255,0.35); }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX( 6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX( 4px); }
    }
  </style>
</head>
<body>

  <!-- ── AR scene ────────────────────────────────────────────────────────── -->
  <a-scene
    id="ar-scene"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    renderer="antialias: true; alpha: true"
    embedded>
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>

  <!-- ── Map view ────────────────────────────────────────────────────────── -->
  <div id="map-view">
    <div id="map-container"></div>
    <button id="btn-recenter" aria-label="Center on my location">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <!-- ── HUD (shared across views) ────────────────────────────────────────── -->
  <div id="hud">
    <div id="top-bar">
      <span id="app-logo">PinAR</span>
      <div id="top-bar-right">
        <div id="gps-badge">
          <div id="gps-dot"></div>
          <span id="gps-label">Locating…</span>
        </div>
        <button id="btn-info" aria-label="About">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="nav-banner">
      <span id="nav-banner-arrow">↑</span>
      <span id="nav-banner-emoji"></span>
      <span id="nav-banner-label">Navigating</span>
      <span id="nav-banner-name"></span>
      <span id="nav-banner-dist"></span>
      <button id="nav-stop-btn" aria-label="Stop navigating">✕</button>
    </div>

    <div id="empty-state">
      <div class="icon">📍</div>
      <p>No pins yet.<br>Tap + to drop your first pin.</p>
    </div>

    <div id="compass-strip">
      <canvas id="compass-canvas" height="68"></canvas>
    </div>

    <div id="toast"></div>
  </div>

  <!-- ── Tab bar ─────────────────────────────────────────────────────────── -->
  <div id="tab-bar">
    <button id="tab-ar" class="tab-btn active" aria-label="AR view">
      <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span>AR</span>
    </button>

    <button id="btn-add" aria-label="Add pin">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <button id="tab-map" class="tab-btn" aria-label="Map view">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Map</span>
      <span class="tab-badge" id="pin-count-badge"></span>
    </button>
  </div>

  <!-- ── Bottom sheet ─────────────────────────────────────────────────────── -->
  <div id="sheet-overlay"></div>
  <div id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div id="sheet-content"></div>
  </div>

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div id="loading">
    <div id="loading-logo">PinAR</div>
    <div class="spinner"></div>
    <div id="loading-sub">Starting camera…</div>
  </div>
